name: Build iOS App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-26
    name: iOS Release
    environment: ios-release

    steps:
      - name: Check for signing secrets
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$HAS_CERT" ]; then
            echo "::error::Apple signing secrets not configured"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri ios init

      - name: Copy app icons into generated Xcode project
        run: |
          ICONSET="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICONSET" ] && [ -d "src-tauri/icons/ios" ]; then
            cp src-tauri/icons/ios/*.png "$ICONSET/"
            echo "Copied iOS app icons"
          else
            echo "Warning: Icon directories not found"
          fi

      - name: Patch iOS Info.plist
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          test -n "$PLIST" || { echo "::error::no Info.plist in the generated project"; exit 1; }
          echo "patching $PLIST"
          # plutil edits the parsed structure. The sed this replaced inserted
          # before every </dict>, which puts keys inside nested dictionaries too.
          # remove-then-insert, so this behaves the same whether or not the key
          # is already present and however -replace treats a missing key
          set_bool() {
            plutil -remove "$1" "$PLIST" >/dev/null 2>&1 || true
            plutil -insert "$1" -bool "$2" "$PLIST"
          }
          set_bool UIFileSharingEnabled true
          set_bool LSSupportsOpeningDocumentsInPlace true
          set_bool UISupportsDocumentBrowser true
          # Without this every submission stalls on the export-compliance
          # questionnaire. Mycelium hashes file contents with SHA-256 to detect
          # changes and does nothing else with cryptography, which is exempt.
          set_bool ITSAppUsesNonExemptEncryption false
          plutil -lint "$PLIST"
          plutil -p "$PLIST"

      - name: Add privacy manifest
        run: |
          # Apple rejects at upload when an app uses a required-reason API with
          # no manifest. `tauri ios init` regenerates the project each build, so
          # the file is copied in and registered again every time.
          DEST=src-tauri/gen/apple/PrivacyInfo.xcprivacy
          cp src-tauri/ios/PrivacyInfo.xcprivacy "$DEST"
          plutil -lint "$DEST"
          PBX=$(find src-tauri/gen/apple -name project.pbxproj | head -1)
          test -n "$PBX" || { echo "::error::no project.pbxproj"; exit 1; }
          python3 .github/scripts/add_privacy_manifest.py "$PBX"

          # Reported rather than assumed: whether the target claims iPad decides
          # if iPad screenshots are mandatory on the App Store listing.
          echo "--- TARGETED_DEVICE_FAMILY (1 = iPhone, 2 = iPad) ---"
          grep -o 'TARGETED_DEVICE_FAMILY = [^;]*;' "$PBX" | sort -u

      - name: Link Swift back-deployment archives
        run: |
          # Xcode 26 stopped auto-linking these, but still ships them, while the
          # Swift objects swift-rs compiles into libapp.a force-load
          # swiftCompatibility56 (tauri-apps/tauri#15066). Neither OTHER_LDFLAGS
          # in the environment nor XCODE_XCCONFIG_FILE reaches the link, so the
          # setting goes straight into the generated project.
          SWIFT_LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          ls "$SWIFT_LIB"/libswiftCompatibility*.a
          PBX=$(find src-tauri/gen/apple -name project.pbxproj | head -1)
          echo "patching $PBX"
          python3 - "$PBX" "$SWIFT_LIB" <<'PYEOF'
          import re, sys

          path, libdir = sys.argv[1], sys.argv[2]
          libs = " ".join(
              f"-l{name}"
              for name in (
                  "swiftCompatibility50",
                  "swiftCompatibility51",
                  "swiftCompatibility56",
                  "swiftCompatibilityConcurrency",
                  "swiftCompatibilityDynamicReplacements",
              )
          )
          added = f"-L{libdir} {libs}"
          src = open(path).read()

          def extend(m):
              value = m.group(1).strip()
              if value.startswith("("):
                  entries = " ".join(f'"{lib}",' for lib in added.split())
                  return m.group(0).replace(")", f"{entries}\n\t\t\t\t)", 1)
              inner = value[1:-1] if value.startswith('"') else value
              return f'OTHER_LDFLAGS = "{inner} {added}";'

          def patch(match):
              block = match.group(0)
              if "OTHER_LDFLAGS" in block:
                  return re.sub(r"OTHER_LDFLAGS = ([^;]+);", extend, block)
              return block.replace(
                  "buildSettings = {",
                  f'buildSettings = {{\n\t\t\t\tOTHER_LDFLAGS = "$(inherited) {added}";',
                  1,
              )

          out, count = re.subn(r"buildSettings = \{.*?\n\t*\};", patch, src, flags=re.S)
          open(path, "w").write(out)
          print(f"patched {count} buildSettings blocks")
          PYEOF
          grep -c "lswiftCompatibility56" "$PBX" || { echo "::error::flags not written"; exit 1; }

      - name: Prepare App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$API_KEY" ]; then
            mkdir -p ~/.private_keys
            echo -n "$API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
            echo "API_KEY_PATH=$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV
          fi

      - name: Build iOS release
        env:
          # swift-rs compiles the Swift sources into libapp.a through cargo, not
          # Xcode, so it needs the deployment target too — below 15.4 it emits a
          # force-load of the Swift 5.6 shim that Xcode 26 no longer ships.
          IPHONEOS_DEPLOYMENT_TARGET: "15.4"
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.API_KEY_PATH }}
        run: |
          # Xcode 26 stopped auto-linking the Swift back-deployment archives, but
          # still ships them, and every Swift object compiled into libapp.a by
          # swift-rs force-loads swiftCompatibility56 (tauri-apps/tauri#15066).
          # Link them explicitly; unreferenced ones cost nothing.
          npx tauri ios build --export-method app-store-connect

      - name: Find IPA
        id: find-ipa
        run: |
          FOUND_IPA=$(find src-tauri/gen/apple ~/Library/Developer/Xcode -name "*.ipa" 2>/dev/null | head -1)
          if [ -n "$FOUND_IPA" ]; then
            mkdir -p $RUNNER_TEMP/export
            cp "$FOUND_IPA" $RUNNER_TEMP/export/mycelium-ios.ipa
            echo "ipa_path=$RUNNER_TEMP/export/mycelium-ios.ipa" >> $GITHUB_OUTPUT
          else
            echo "::error::No IPA found after build"
            exit 1
          fi


      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ steps.find-ipa.outputs.ipa_path }}
          retention-days: 90

      - name: Verify store requirements shipped in the IPA
        run: |
          WORK=$(mktemp -d)
          unzip -q "${{ steps.find-ipa.outputs.ipa_path }}" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::no .app inside the IPA"; exit 1; }

          if [ -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "PrivacyInfo.xcprivacy is in the bundle:"
            plutil -p "$APP/PrivacyInfo.xcprivacy"
          else
            echo "::error::PrivacyInfo.xcprivacy missing from the app bundle - App Store Connect will reject this upload"
            ls -la "$APP" | head -40
            exit 1
          fi

          ENC=$(plutil -extract ITSAppUsesNonExemptEncryption raw "$APP/Info.plist" 2>/dev/null || echo MISSING)
          echo "ITSAppUsesNonExemptEncryption = $ENC"
          test "$ENC" = "false" || { echo "::error::encryption declaration did not reach the bundle (got: $ENC)"; exit 1; }
      - name: Upload to TestFlight
        if: env.API_KEY_PATH != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f ${{ steps.find-ipa.outputs.ipa_path }} \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.find-ipa.outputs.ipa_path }}
