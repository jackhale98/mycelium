name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # The mobile half of the folder-picker plugin is #[cfg(mobile)], so it
          # is invisible to a host build. This target compiles it without needing
          # an NDK, since that crate pulls in no C dependencies.
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend type check
        run: npx svelte-check --threshold error

      - name: Frontend tests
        run: npx vitest run

      - name: Rust tests
        # The whole workspace, not just the parser and db: the Tauri crate holds
        # the path, atomic-write and temp-sweep tests.
        run: cargo test --workspace

      - name: Release script tests
        # These patch the generated Xcode project, which only exists on a Mac
        # runner, so their logic is tested here against a fixture instead.
        run: python3 .github/scripts/test_add_privacy_manifest.py

      - name: Check Tauri compilation
        run: cargo check -p mycelium

      - name: Check mobile plugin compilation
        run: cargo check -p tauri-plugin-folder-picker --target aarch64-linux-android
