name: iOS Toolchain Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    name: Probe
    steps:
      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swiftc --version

      - name: Swift compatibility libraries in the toolchain
        run: |
          TC=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift
          echo "toolchain swift lib dir: $TC"
          for d in iphoneos iphonesimulator macosx; do
            echo "--- $d ---"
            ls -1 "$TC/$d" 2>/dev/null | grep -i compat || echo "(no compatibility archives)"
          done

      - name: Compatibility libraries anywhere under Xcode
        run: |
          find "$(xcode-select -p)" -name 'libswiftCompatibility*' 2>/dev/null | head -20 || true
          echo "--- exit ---"

      - name: What a minimal Swift object force-loads
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          echo 'public func hello() -> Int { 42 }' > hello.swift
          for target in arm64-apple-ios15.0 arm64-apple-ios15.4 arm64-apple-ios16.0 arm64-apple-ios18.0; do
            swiftc -emit-object -target $target \
              -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" hello.swift -o hello-$target.o 2>/dev/null || {
                echo "$target: compile failed"; continue; }
            echo -n "$target: "
            nm hello-$target.o | grep -o 'swiftCompatibility[0-9a-zA-Z]*' | sort -u | tr '\n' ' '
            echo
          done
