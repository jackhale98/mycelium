name: Build Android App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Android (arm64)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and set NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1)
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK: $NDK_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init

      - name: Build frontend
        run: npm run build

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE secret set - building a debug APK."
            echo "Play needs a signed bundle; see docs/android-release-setup.md."
            exit 0
          fi
          echo -n "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # keystore.properties is read by the patched gradle file and never committed.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
          python3 .github/scripts/add_android_signing.py src-tauri/gen/android/app/build.gradle.kts
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release bundle
        if: steps.signing.outputs.signed == 'true'
        # An .aab is what Play accepts; the .apk alongside it is for sideloading
        # and for the GitHub release, which cannot install a bundle.
        run: npx tauri android build --target aarch64 --aab --apk

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: npx tauri android build --target aarch64 --debug
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: s
          CARGO_PROFILE_DEV_LTO: "true"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
          CARGO_PROFILE_DEV_STRIP: "true"

      - name: Collect artifacts
        id: apk
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"
            cp "$APK" mycelium-android-arm64.apk
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

          AAB=$(find src-tauri/gen/android -name "*.aab" -type f | head -1)
          if [ -n "$AAB" ]; then
            echo "Found AAB: $AAB ($(du -h "$AAB" | cut -f1))"
            cp "$AAB" mycelium-android.aab
            echo "aab=true" >> "$GITHUB_OUTPUT"
          else
            echo "aab=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mycelium-android-arm64.apk
          retention-days: 14

      - name: Upload AAB artifact
        if: steps.apk.outputs.aab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mycelium-android.aab
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: mycelium-android-arm64.apk

      - name: Upload AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.aab == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: mycelium-android.aab
